<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attend List</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<style>
/* ─── TOKENS ─── */
:root{
  --white:#FFFFFF;
  --off:#F8FAFC;
  --navy:#0F172A;
  --navy-2:#1E3A8A;
  --blue:#2563EB;
  --cyan:#38BDF8;
  --purple:#7C3AED;
  --purple-glow:rgba(124,58,237,0.15);
  --blue-glow:rgba(37,99,235,0.18);
  --emerald:#10B981;
  --emerald-light:#ECFDF5;
  --amber:#F59E0B;
  --amber-light:#FFFBEB;
  --red:#EF4444;
  --red-light:#FEF2F2;
  --slate-50:#F8FAFC;
  --slate-100:#F1F5F9;
  --slate-200:#E2E8F0;
  --slate-300:#CBD5E1;
  --slate-400:#94A3B8;
  --slate-500:#64748B;
  --slate-600:#475569;
  --slate-700:#334155;
  --slate-900:#0F172A;
  --r:22px;
  --r-sm:14px;
  --r-xs:10px;
  --shadow-card:0 1px 3px rgba(15,23,42,0.04),0 8px 32px rgba(15,23,42,0.06),0 1px 0 rgba(255,255,255,0.8) inset;
  --shadow-float:0 4px 6px rgba(15,23,42,0.04),0 20px 60px rgba(15,23,42,0.12),0 1px 0 rgba(255,255,255,0.9) inset;
  --shadow-btn:0 4px 24px rgba(37,99,235,0.30),0 1px 3px rgba(15,23,42,0.15);
  --shadow-btn-hover:0 8px 40px rgba(37,99,235,0.45),0 2px 8px rgba(15,23,42,0.18);
  --grad-primary:linear-gradient(135deg,#0F172A 0%,#1E3A8A 35%,#2563EB 70%,#38BDF8 100%);
  --grad-soft:linear-gradient(135deg,#2563EB,#7C3AED);
  --transition:cubic-bezier(0.22,1,0.36,1);
  --transition-snappy:cubic-bezier(0.34,1.56,0.64,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ─── PAGE ─── */
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;
  background:#FFFFFF;
  min-height:100vh;
  color:var(--slate-900);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}

/* ─── PREMIUM WHITE BACKGROUND SYSTEM ─── */
/* Layer 1: Static base mesh — always white with soft color warmth */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 1000px 800px at 0% 0%,   rgba(37,99,235,0.09)  0%, transparent 60%),
    radial-gradient(ellipse 800px  600px at 100% 0%,  rgba(124,58,237,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 700px  600px at 100% 100%,rgba(16,185,129,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 600px  500px at 0%   100%,rgba(56,189,248,0.06) 0%, transparent 55%),
    radial-gradient(ellipse 500px  400px at 50%  50%, rgba(37,99,235,0.04)  0%, transparent 60%),
    #FFFFFF;
  pointer-events:none;
  z-index:0;
}

/* Layer 2: Animated soft noise texture for depth */
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
  background-size:200px 200px;
  pointer-events:none;
  z-index:0;
  opacity:0.5;
}

/* ─── FLOATING ORBS — more visible, still clean ─── */
.orb{
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  z-index:0;
  will-change:transform;
  /* No will-change:filter — causes compositing layer bloat */
}
.orb-1{
  width:700px;height:700px;
  top:-250px;left:-200px;
  background:radial-gradient(circle at 40% 40%,rgba(37,99,235,0.10) 0%,rgba(37,99,235,0.04) 50%,transparent 70%);
  animation:orbFloat1 24s ease-in-out infinite;
}
.orb-2{
  width:600px;height:600px;
  bottom:-200px;right:-150px;
  background:radial-gradient(circle at 60% 60%,rgba(16,185,129,0.09) 0%,rgba(56,189,248,0.05) 50%,transparent 70%);
  animation:orbFloat2 30s ease-in-out infinite;
}
.orb-3{
  width:500px;height:500px;
  top:35%;left:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 50% 50%,rgba(124,58,237,0.06) 0%,rgba(37,99,235,0.03) 50%,transparent 70%);
  animation:orbFloat3 22s ease-in-out infinite;
}
.orb-4{
  width:350px;height:350px;
  top:10%;right:5%;
  background:radial-gradient(circle,rgba(245,158,11,0.04) 0%,transparent 70%);
  animation:orbFloat4 26s ease-in-out infinite;
}
@keyframes orbFloat1{
  0%,100%{transform:translate(0,0)}
  33%{transform:translate(50px,-40px)}
  66%{transform:translate(-25px,25px)}
}
@keyframes orbFloat2{
  0%,100%{transform:translate(0,0)}
  40%{transform:translate(-45px,30px)}
  75%{transform:translate(25px,-20px)}
}
@keyframes orbFloat3{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.12)}
}
@keyframes orbFloat4{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(-30px,40px)}
}

/* ─── PARTICLE DOTS — GPU only, smooth ─── */
.particle-field{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}
.particle{
  position:absolute;
  border-radius:50%;
  opacity:0;
  will-change:transform,opacity;
  animation:particleDrift var(--dur,12s) ease-in-out var(--delay,0s) infinite;
}
@keyframes particleDrift{
  0%{opacity:0;transform:translateY(0) scale(0.5)}
  8%{opacity:var(--op,0.5)}
  88%{opacity:var(--op,0.2)}
  100%{opacity:0;transform:translateY(-100vh) scale(1.2)}
}

/* ─── TOP BAR ─── */
.topbar{
  position:sticky;
  top:0;
  z-index:200;
  background:rgba(255,255,255,0.80);
  backdrop-filter:blur(28px) saturate(200%);
  -webkit-backdrop-filter:blur(28px) saturate(200%);
  border-bottom:1px solid rgba(255,255,255,0.6);
  padding:0 2rem;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:background 0.4s ease, box-shadow 0.4s ease;
  will-change:transform;
}
.topbar.scrolled{
  background:rgba(255,255,255,0.92);
  box-shadow:0 1px 0 rgba(15,23,42,0.06),0 4px 24px rgba(15,23,42,0.06);
}
/* topbar bottom gradient accent line */
.topbar::after{
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(37,99,235,0.25),rgba(124,58,237,0.2),transparent);
  opacity:0;
  transition:opacity 0.4s ease;
}
.topbar.scrolled::after{opacity:1}

.logo{display:flex;align-items:center;gap:11px;cursor:pointer}
.logo-mark{
  width:36px;height:36px;
  background:var(--grad-primary);
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  overflow:hidden;
  transition:transform 0.45s var(--transition-snappy), box-shadow 0.3s ease;
  box-shadow:0 2px 8px rgba(37,99,235,0.3);
}
.logo-mark::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.18) 0%,transparent 55%);
  border-radius:inherit;
}
.logo-mark:hover,.logo:hover .logo-mark{
  transform:rotate(-8deg) scale(1.08);
  box-shadow:0 4px 20px rgba(37,99,235,0.4);
}
.logo-mark svg{width:18px;height:18px;position:relative;z-index:1}
.logo-text{
  font-family:'Instrument Serif',serif;
  font-size:20px;
  color:var(--slate-900);
  letter-spacing:-0.02em;
  background:linear-gradient(135deg,var(--slate-900),var(--navy-2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  transition:opacity 0.3s ease;
}
.logo:hover .logo-text{opacity:0.75}

.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-date{
  font-size:11.5px;
  color:var(--slate-700);
  font-weight:500;
  padding:6px 14px;
  background:rgba(241,245,249,0.85);
  backdrop-filter:blur(10px);
  border:1px solid rgba(203,213,225,0.6);
  border-radius:99px;
  letter-spacing:0.01em;
  transition:all 0.3s var(--transition);
  white-space:nowrap;
}
.topbar-date:hover{
  background:rgba(226,232,240,0.9);
  border-color:rgba(148,163,184,0.5);
  transform:scale(1.02);
}

/* ─── HERO ─── */
.hero{
  position:relative;
  overflow:hidden;
  padding:4.5rem 1.5rem 6rem;
  text-align:center;
  z-index:1;
  /* subtle warm-white gradient band */
  background:linear-gradient(180deg,
    rgba(239,246,255,0.55) 0%,
    rgba(255,255,255,0) 60%
  );
}
/* premium mesh grid */
.hero::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(37,99,235,0.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,0.07) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse 90% 95% at 50% 50%,black 10%,transparent 68%);
  -webkit-mask-image:radial-gradient(ellipse 90% 95% at 50% 50%,black 10%,transparent 68%);
  pointer-events:none;
  animation:gridShift 24s ease-in-out infinite;
}
@keyframes gridShift{
  0%,100%{background-position:0 0}
  50%{background-position:5px 5px}
}
/* glow center */
.hero::after{
  content:'';
  position:absolute;
  top:30%;left:50%;
  transform:translate(-50%,-50%);
  width:700px;height:500px;
  background:radial-gradient(ellipse,rgba(37,99,235,0.09) 0%,rgba(124,58,237,0.04) 40%,transparent 70%);
  pointer-events:none;
  animation:heroGlow 7s ease-in-out infinite;
}
@keyframes heroGlow{
  0%,100%{opacity:0.7;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
}

.hero-chip-wrap{display:flex;justify-content:center;margin-bottom:24px}
.hero-chip{
  display:inline-flex;align-items:center;gap:9px;
  padding:7px 18px 7px 11px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(16px);
  border:1px solid rgba(37,99,235,0.18);
  border-radius:99px;
  box-shadow:0 2px 12px rgba(37,99,235,0.08),0 1px 2px rgba(0,0,0,0.04);
  font-size:11px;font-weight:600;
  color:var(--slate-500);
  letter-spacing:0.06em;text-transform:uppercase;
  white-space:nowrap;
  transition:all 0.4s var(--transition);
  cursor:default;
}
.hero-chip:hover{
  border-color:rgba(37,99,235,0.35);
  box-shadow:0 4px 20px rgba(37,99,235,0.15),0 1px 4px rgba(0,0,0,0.06);
  transform:translateY(-1px);
}
.hero-chip-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--emerald);
  box-shadow:0 0 0 3px rgba(16,185,129,0.2);
  animation:pulse-dot 2.5s ease infinite;
  flex-shrink:0;
}
@keyframes pulse-dot{
  0%,100%{box-shadow:0 0 0 3px rgba(16,185,129,0.2)}
  50%{box-shadow:0 0 0 7px rgba(16,185,129,0.06)}
}

.hero h1{
  font-family:'Instrument Serif',serif;
  font-size:clamp(40px,8vw,68px);
  color:var(--slate-900);
  line-height:1.03;
  letter-spacing:-0.025em;
  margin-bottom:16px;
}
.hero h1 em{
  font-style:italic;
  background:var(--grad-primary);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  position:relative;
  display:inline-block;
}
/* animated gradient shimmer */
.hero h1 em{
  background-size:300% 100%;
  animation:gradShimmer 5s ease infinite;
}
@keyframes gradShimmer{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
/* glow underline */
.hero h1 em::after{
  content:'';
  position:absolute;
  bottom:-8px;
  left:0;right:0;
  height:3px;
  background:var(--grad-primary);
  background-size:300% 100%;
  border-radius:99px;
  transform-origin:left;
  animation:grow-line 1.1s var(--transition) 0.9s both,gradShimmer 5s ease 2s infinite;
  box-shadow:0 2px 12px rgba(37,99,235,0.4);
}
@keyframes grow-line{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.hero-sub{
  font-size:15px;
  color:var(--slate-600);
  font-weight:400;
  max-width:340px;
  margin:0 auto;
  line-height:1.65;
}

/* ─── MAIN CONTENT ─── */
.main{
  max-width:520px;
  margin:-3rem auto 0;
  padding:0 1.25rem 5rem;
  position:relative;
  z-index:10;
}

/* ─── STATS STRIP ─── */
.stats-strip{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}
.stat-box{
  background:#FFFFFF;
  border:1px solid rgba(226,232,240,0.9);
  border-radius:var(--r-sm);
  padding:18px 12px;
  text-align:center;
  box-shadow:0 2px 12px rgba(15,23,42,0.05),0 1px 3px rgba(15,23,42,0.03);
  position:relative;
  overflow:hidden;
  transition:transform 0.45s var(--transition-snappy),box-shadow 0.45s var(--transition);
  will-change:transform;
  cursor:default;
}
.stat-box::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2.5px;
  background:var(--grad-primary);
  background-size:300% 100%;
  transform:scaleX(0);
  transform-origin:left;
  transition:transform 0.5s var(--transition);
  animation:gradShimmer 5s ease infinite;
}
.stat-box:hover::before{transform:scaleX(1)}

/* shimmer glass reflection */
.stat-box::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.4) 0%,transparent 50%);
  pointer-events:none;
  border-radius:inherit;
  opacity:0;
  transition:opacity 0.4s ease;
}
.stat-box:hover::after{opacity:1}

.stat-box:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:var(--shadow-float),0 0 0 1px rgba(37,99,235,0.08);
}

.stat-num{
  font-family:'Instrument Serif',serif;
  font-size:30px;
  font-weight:400;
  background:var(--grad-primary);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  background-size:300% 100%;
  animation:gradShimmer 5s ease infinite;
  line-height:1;
  margin-bottom:5px;
}
.stat-lbl{
  font-size:9.5px;
  color:var(--slate-600);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.07em;
}

/* shimmer loading */
.stat-num.loading{
  background:linear-gradient(90deg,#f0f4f8 25%,#f8fafc 50%,#f0f4f8 75%) !important;
  background-size:200% 100% !important;
  animation:shimmer 1.5s infinite !important;
  -webkit-background-clip:text !important;
  background-clip:text !important;
  -webkit-text-fill-color:transparent !important;
  border-radius:4px;
  min-height:30px;
  display:inline-block;
  min-width:44px;
}
@keyframes shimmer{
  0%{background-position:-200% 0}
  100%{background-position:200% 0}
}

/* ─── CARD ─── */
.card{
  background:#FFFFFF;
  border:1px solid rgba(226,232,240,0.85);
  border-radius:var(--r);
  box-shadow:
    0 1px 3px rgba(15,23,42,0.04),
    0 12px 40px rgba(15,23,42,0.08),
    0 0 0 1px rgba(255,255,255,0.8) inset,
    0 1px 0 rgba(255,255,255,1) inset;
  padding:2.2rem;
  margin-bottom:18px;
  transition:transform 0.45s var(--transition),box-shadow 0.45s var(--transition);
  position:relative;
  overflow:hidden;
  will-change:transform;
}
/* card glass top sheen */
.card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.9),transparent);
  pointer-events:none;
}
.card::after{
  content:'';
  position:absolute;
  top:0;left:0;
  width:100%;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,0.3) 0%,transparent 100%);
  pointer-events:none;
  border-radius:inherit;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:var(--shadow-float);
}

/* ─── CARD HEADER ─── */
.card-header{
  display:flex;align-items:center;gap:14px;
  margin-bottom:1.6rem;
  padding-bottom:1.4rem;
  border-bottom:1px solid rgba(226,232,240,0.7);
  position:relative;z-index:1;
}
.card-icon{
  width:46px;height:46px;
  background:var(--grad-primary);
  background-size:300% 100%;
  animation:gradShimmer 5s ease infinite;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(37,99,235,0.3);
  transition:transform 0.4s var(--transition-snappy),box-shadow 0.3s ease;
}
.card-icon::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.2) 0%,transparent 55%);
}
.card-icon:hover,.card-header:hover .card-icon{
  transform:scale(1.08) rotate(-5deg);
  box-shadow:0 6px 24px rgba(37,99,235,0.4);
}
.card-icon svg{width:22px;height:22px;position:relative;z-index:1}
.card-title{
  font-family:'Instrument Serif',serif;
  font-size:18px;
  color:var(--slate-900);
  letter-spacing:-0.015em;
}
.card-subtitle{font-size:12px;color:var(--slate-600);margin-top:3px;font-weight:400;line-height:1.4}

/* ─── SESSION DISPLAY ─── */
.session-display{
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,rgba(15,23,42,0.03) 0%,rgba(37,99,235,0.04) 100%);
  backdrop-filter:blur(10px);
  border:1px solid rgba(37,99,235,0.12);
  border-radius:var(--r-sm);
  padding:14px 18px;
  margin-bottom:1.8rem;
  position:relative;
  overflow:hidden;
  transition:all 0.4s var(--transition);
  z-index:1;
}
.session-display::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(37,99,235,0.5),rgba(124,58,237,0.4),transparent);
}
.session-display:hover{
  border-color:rgba(37,99,235,0.22);
  background:linear-gradient(135deg,rgba(15,23,42,0.04) 0%,rgba(37,99,235,0.06) 100%);
  transform:translateY(-1px);
  box-shadow:0 4px 20px rgba(37,99,235,0.08);
}
.session-pulse{
  width:11px;height:11px;
  border-radius:50%;
  background:var(--blue);
  flex-shrink:0;
  position:relative;
  box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}
.session-pulse::before{
  content:'';
  position:absolute;
  inset:-5px;
  border-radius:50%;
  border:1.5px solid var(--blue);
  opacity:0;
  animation:ring-pulse 2.5s ease infinite;
}
@keyframes ring-pulse{
  0%{transform:scale(0.8);opacity:0.6}
  100%{transform:scale(2.2);opacity:0}
}
.session-info{flex:1}
.session-label{
  font-size:9.5px;font-weight:700;
  color:var(--blue);
  text-transform:uppercase;letter-spacing:0.1em;
  opacity:0.8;
}
.session-value{
  font-family:'Instrument Serif',serif;
  font-size:17px;
  color:var(--slate-900);
  margin-top:2px;
  letter-spacing:-0.01em;
}

/* ─── FORM GROUPS ─── */
.form-group{margin-bottom:1.4rem;position:relative}

.form-label{
  display:flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:700;
  color:var(--slate-700);
  text-transform:uppercase;letter-spacing:0.08em;
  margin-bottom:9px;
  transition:color 0.3s ease;
}
.form-group:focus-within .form-label{color:var(--blue)}
.form-label svg{width:13px;height:13px;opacity:0.6;transition:opacity 0.3s ease}
.form-group:focus-within .form-label svg{opacity:1}

/* identity badge */
.name-wrap{position:relative}
.identity-badge{
  position:absolute;
  right:13px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:50%;
  background:var(--slate-100);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--slate-400);
  transition:all 0.4s var(--transition-snappy);
  text-transform:uppercase;
  user-select:none;
  border:1.5px solid transparent;
}
.identity-badge.active{
  background:var(--grad-primary);
  background-size:300% 100%;
  animation:gradShimmer 5s ease infinite;
  color:var(--white);
  border-color:transparent;
  box-shadow:0 2px 12px rgba(37,99,235,0.35);
  transform:translateY(-50%) scale(1.1);
}

/* roll valid icon */
.roll-wrap{position:relative}
.roll-valid-icon{
  position:absolute;
  right:13px;top:50%;transform:translateY(-50%) scale(0.5);
  width:20px;height:20px;
  color:var(--emerald);
  opacity:0;
  transition:opacity 0.35s ease,transform 0.45s var(--transition-snappy);
}
.roll-valid-icon.show{
  opacity:1;
  transform:translateY(-50%) scale(1);
}

/* ─── INPUTS ─── */
.form-input{
  width:100%;
  padding:14px 17px;
  border:1.5px solid rgba(203,213,225,0.9);
  border-radius:var(--r-xs);
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  color:var(--slate-900);
  background:#FAFBFC;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
  transition:border-color 0.3s ease,box-shadow 0.3s ease,background 0.3s ease,transform 0.3s var(--transition);
}
.form-input:hover{
  border-color:rgba(148,163,184,0.9);
  background:#F8FAFC;
}
.form-input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(37,99,235,0.10),0 2px 10px rgba(37,99,235,0.08);
  background:#FFFFFF;
  transform:scale(1.005);
}
.form-input::placeholder{color:var(--slate-300)}
.form-input.has-badge{padding-right:52px}
.form-input.has-tick{padding-right:44px}

.hint{
  font-size:11px;color:var(--slate-600);
  margin-top:7px;
  display:flex;align-items:center;gap:5px;
}
.hint svg{opacity:0.55;flex-shrink:0}

/* ─── SECTION BUTTONS ─── */
.section-btns{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.section-btn{
  padding:15px 10px;
  border:1.5px solid rgba(203,213,225,0.9);
  border-radius:var(--r-xs);
  background:#FAFBFC;
  font-family:'DM Sans',sans-serif;
  font-size:14px;font-weight:600;
  color:var(--slate-500);
  cursor:pointer;
  transition:all 0.35s var(--transition-snappy);
  display:flex;align-items:center;justify-content:center;gap:8px;
  position:relative;overflow:hidden;
  will-change:transform;
}
.section-btn::before{
  content:'';
  position:absolute;inset:0;
  background:var(--grad-primary);
  background-size:200% 100%;
  opacity:0;
  transition:opacity 0.3s ease;
}
.section-btn::after{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.6),transparent);
  opacity:0;
  transition:opacity 0.3s ease;
}
.section-btn:hover:not(.selected){
  border-color:rgba(37,99,235,0.3);
  color:var(--blue);
  transform:translateY(-3px);
  box-shadow:0 4px 20px rgba(37,99,235,0.1);
  background:rgba(239,246,255,0.8);
}
.section-btn.selected{
  border-color:transparent;
  color:var(--white);
  box-shadow:0 4px 20px rgba(37,99,235,0.35),0 1px 4px rgba(15,23,42,0.15);
  transform:translateY(-3px) scale(1.01);
}
.section-btn.selected::before{opacity:1;animation:gradShimmer 5s ease infinite}
.section-btn.selected::after{opacity:1}
.section-btn svg{width:15px;height:15px;position:relative;z-index:1;transition:transform 0.3s var(--transition-snappy)}
.section-btn:hover svg{transform:scale(1.1)}
.section-btn span{position:relative;z-index:1}

/* ─── SUBMIT BUTTON ─── */
.btn-submit{
  width:100%;
  padding:16px;
  background:var(--grad-primary);
  background-size:300% 100%;
  animation:gradShimmer 5s ease infinite;
  color:var(--white);
  border:none;
  border-radius:var(--r-xs);
  font-family:'DM Sans',sans-serif;
  font-size:15px;font-weight:600;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  letter-spacing:0.01em;
  margin-top:0.6rem;
  position:relative;overflow:hidden;
  box-shadow:var(--shadow-btn);
  transition:box-shadow 0.35s var(--transition),transform 0.3s var(--transition-snappy),opacity 0.2s ease;
  will-change:transform;
}
/* light sweep */
.btn-submit::before{
  content:'';
  position:absolute;
  top:0;left:-110%;
  width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.18),transparent);
  transform:skewX(-20deg);
  transition:left 0.7s ease;
  pointer-events:none;
}
/* top glass sheen */
.btn-submit::after{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,0.12) 0%,transparent 100%);
  border-radius:inherit;
  pointer-events:none;
}
.btn-submit:hover:not(:disabled)::before{left:160%}
.btn-submit:hover:not(:disabled){
  box-shadow:var(--shadow-btn-hover);
  transform:translateY(-5px) scale(1.02);
}
.btn-submit:active:not(:disabled){
  transform:scale(0.97) translateY(0);
  box-shadow:var(--shadow-btn);
  animation-play-state:paused;
}
.btn-submit:disabled{opacity:0.55;cursor:not-allowed;animation:none;background:var(--grad-primary)}

/* ripple */
.ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,0.35);
  transform:scale(0);
  animation:rippleAnim 0.7s ease-out forwards;
  pointer-events:none;
}
@keyframes rippleAnim{
  to{transform:scale(4);opacity:0}
}

/* ─── SPINNER ─── */
.spinner{
  width:18px;height:18px;
  border:2px solid rgba(255,255,255,0.35);
  border-top-color:white;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── ALERTS ─── */
.alert{
  border-radius:var(--r-xs);
  padding:15px 17px;
  font-size:13px;
  display:none;
  align-items:flex-start;
  gap:12px;
  margin-top:18px;
  animation:slide-alert 0.45s var(--transition) both;
  backdrop-filter:blur(14px);
  position:relative;overflow:hidden;
}
.alert::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:1.5px;
}
@keyframes slide-alert{
  from{opacity:0;transform:translateY(-10px) scale(0.98)}
  to{opacity:1;transform:none}
}
.alert.show{display:flex}
.alert svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.alert-success{
  background:rgba(236,253,245,0.85);
  color:#065F46;
  border:1px solid rgba(16,185,129,0.2);
}
.alert-success::before{background:linear-gradient(90deg,var(--emerald),rgba(16,185,129,0.4))}
.alert-warning{
  background:rgba(255,251,235,0.88);
  color:#92400E;
  border:1px solid rgba(245,158,11,0.25);
}
.alert-warning::before{background:linear-gradient(90deg,var(--amber),rgba(245,158,11,0.4))}
.alert-error{
  background:rgba(254,242,242,0.88);
  color:#991B1B;
  border:1px solid rgba(239,68,68,0.18);
}
.alert-error::before{background:linear-gradient(90deg,var(--red),rgba(239,68,68,0.4))}
.alert-body .alert-title{font-weight:700;margin-bottom:3px;font-size:13px}
.alert-body{font-size:13px;line-height:1.55}

/* ─── FOOTER ─── */
.footer{
  text-align:center;
  padding:1.5rem 1rem 3rem;
  font-size:11.5px;
  color:var(--slate-500);
  line-height:1.9;
  position:relative;z-index:1;
  background:linear-gradient(0deg,rgba(239,246,255,0.4) 0%,transparent 100%);
}
.footer strong{color:var(--slate-700)}

/* ─── CONFETTI CANVAS ─── */
#confetti-canvas{
  position:fixed;inset:0;
  pointer-events:none;
  z-index:999;
  display:none;
}

/* ─── ENTRANCE ANIMATIONS ─── */
@keyframes premiumFadeUp{
  from{opacity:0;transform:translateY(28px);filter:blur(4px)}
  to{opacity:1;transform:translateY(0);filter:blur(0)}
}
@keyframes premiumFadeDown{
  from{opacity:0;transform:translateY(-12px)}
  to{opacity:1;transform:translateY(0)}
}
.topbar{animation:premiumFadeDown 0.6s var(--transition) both}
.hero-chip-wrap{animation:premiumFadeUp 0.7s var(--transition) 0.1s both}
.hero h1{animation:premiumFadeUp 0.85s var(--transition) 0.2s both}
.hero-sub{animation:premiumFadeUp 0.75s var(--transition) 0.35s both}
.stats-strip{animation:premiumFadeUp 0.75s var(--transition) 0.48s both}
.card{animation:premiumFadeUp 0.85s var(--transition) 0.6s both}
.footer{animation:premiumFadeUp 0.65s var(--transition) 0.75s both}

/* ─── SCROLL REVEAL ─── */
.reveal{
  opacity:0;
  transform:translateY(24px);
  filter:blur(3px);
  transition:opacity 0.7s var(--transition),transform 0.7s var(--transition),filter 0.7s ease;
}
.reveal.visible{
  opacity:1;
  transform:none;
  filter:none;
}

/* ─── RESPONSIVE ─── */
@media(max-width:520px){
  .hero{padding:3.5rem 1.25rem 5rem}
  .card{padding:1.6rem}
  .topbar{padding:0 1.1rem}
  .stat-num{font-size:26px}
  .btn-submit{padding:15px}
}
@media(max-width:360px){
  .hero h1{font-size:36px}
  .stats-strip{gap:8px}
  .stat-box{padding:14px 8px}
}

/* ─── TILT EFFECT VARS ─── */
.tilt{transform-style:preserve-3d;perspective:1000px}
</style>

  <button onclick="testPost()" style="background:#10b981;color:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;margin-left:6px;">Test POST</button>
  <pre id="debug-out" style="margin-top:10px;white-space:pre-wrap;word-break:break-all;color:#e2e8f0;background:#0f172a;padding:8px;border-radius:6px;font-size:10px;"></pre>
</div>

<!-- App logic — DO NOT EDIT -->
<script>
var C = window.SITE_CONFIG;
var SHEETDB_URL = C.sheetdbUrl;
var _selectedSection = '';
var _currentSession  = '';
var _isSubmitting    = false;   /* ← submission lock: prevents race-condition double saves */
var _cachedSheetKeys = null;    /* ← cache sheet keys after first fetch */
var today = new Date();

/* ---------- Apply config to DOM ---------- */
(function applyConfig() {
  document.title = C.pageTitle;
  document.getElementById('logo-text').textContent        = C.logoText;
  document.getElementById('hero-chip-text').textContent   = C.hero.chip;
  document.getElementById('hero-heading').innerHTML       = C.hero.heading;
  document.getElementById('hero-sub').textContent         = C.hero.sub;
  document.getElementById('lbl-total').textContent        = C.stats.totalLabel;
  document.getElementById('lbl-today').textContent        = C.stats.todayLabel;
  document.getElementById('lbl-sessions').textContent     = C.stats.sessionsLabel;
  document.getElementById('card-title').textContent       = C.card.title;
  document.getElementById('card-subtitle').textContent    = C.card.subtitle;
  document.getElementById('session-label').textContent    = C.session.label;
  document.getElementById('lbl-name-text').textContent    = C.fields.name.label;
  document.getElementById('inp-name').placeholder         = C.fields.name.placeholder;
  document.getElementById('lbl-roll-text').textContent    = C.fields.roll.label;
  document.getElementById('inp-roll').placeholder         = C.fields.roll.placeholder;
  document.getElementById('lbl-section-text').textContent = C.fields.section.label;
  document.getElementById('lbl-btn-a').textContent        = C.fields.section.btnA;
  document.getElementById('lbl-btn-b').textContent        = C.fields.section.btnB;
  document.getElementById('submit-btn-text').textContent  = C.submitBtnText;
  document.getElementById('footer-line1').innerHTML       = C.footer.line1;
  document.getElementById('footer-line2').textContent     = C.footer.line2;
  document.getElementById('alert-success-title').textContent = C.alerts.successTitle;
  document.getElementById('alert-warning-title').textContent = C.alerts.warningTitle;
  document.getElementById('alert-error-title').textContent   = C.alerts.errorTitle;

  function applyHint(hintId, textId, text) {
    if (text) {
      document.getElementById(textId).textContent = text;
      document.getElementById(hintId).style.display = 'flex';
    }
  }
  applyHint('hint-name',    'hint-name-text',    C.fields.name.hint);
  applyHint('hint-roll',    'hint-roll-text',    C.fields.roll.hint);
  applyHint('hint-section', 'hint-section-text', C.fields.section.hint);
})();

/* ---------- Initialise ---------- */
(function init() {
  document.getElementById('top-date').textContent = today.toLocaleDateString('en-IN', {weekday:'short', day:'2-digit', month:'short', year:'numeric'});

  var start = new Date(C.startDate);
  start.setHours(0, 0, 0, 0);
  var now = new Date();
  now.setHours(0, 0, 0, 0);
  var diff = Math.floor((now - start) / 86400000);
  var currentDay = Math.max(1, diff + 1);

  _currentSession = 'Day ' + currentDay;
  document.getElementById('session-value').textContent = _currentSession;

  loadStats();
  initParticles();
  initScrollReveal();
  initTopbarScroll();
  initRipple();
  initTilt();
})();

/* ---------- Particles — smooth GPU-only ---------- */
function initParticles() {
  var field = document.getElementById('particle-field');
  var configs = [
    {color:'rgba(37,99,235,',op:0.5},
    {color:'rgba(124,58,237,',op:0.4},
    {color:'rgba(16,185,129,',op:0.4},
    {color:'rgba(56,189,248,',op:0.55},
    {color:'rgba(245,158,11,',op:0.3},
  ];
  for (var i = 0; i < 10; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    var cfg = configs[Math.floor(Math.random() * configs.length)];
    var size = 2 + Math.random() * 3;
    p.style.cssText = [
      'left:' + (Math.random() * 100) + '%',
      'bottom:0',
      'width:' + size + 'px',
      'height:' + size + 'px',
      'background:' + cfg.color + cfg.op + ')',
      '--dur:' + (14 + Math.random() * 16) + 's',
      '--delay:' + (Math.random() * 14) + 's',
      '--op:' + cfg.op,
    ].join(';');
    field.appendChild(p);
  }
}

/* ---------- Scroll Reveal ---------- */
function initScrollReveal() {
  var els = document.querySelectorAll('.reveal');
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(e, idx) {
      if (e.isIntersecting) {
        setTimeout(function() {
          e.target.classList.add('visible');
        }, idx * 80);
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.1 });
  els.forEach(function(el) { io.observe(el); });
}

/* ---------- Topbar scroll effect ---------- */
function initTopbarScroll() {
  var tb = document.querySelector('.topbar');
  window.addEventListener('scroll', function() {
    if (window.scrollY > 10) tb.classList.add('scrolled');
    else tb.classList.remove('scrolled');
  }, { passive: true });
}

/* ---------- Ripple on submit ---------- */
function initRipple() {
  var btn = document.getElementById('btn-submit');
  btn.addEventListener('click', function(e) {
    if (btn.disabled) return;
    var r = document.createElement('span');
    r.className = 'ripple';
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size/2) + 'px';
    r.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(r);
    setTimeout(function() { r.remove(); }, 700);
  });
}

/* ---------- Subtle 3D tilt ---------- */
function initTilt() {
  var cards = document.querySelectorAll('.tilt');
  cards.forEach(function(card) {
    card.addEventListener('mousemove', function(e) {
      var rect = card.getBoundingClientRect();
      var x = (e.clientX - rect.left) / rect.width - 0.5;
      var y = (e.clientY - rect.top) / rect.height - 0.5;
      card.style.transform = 'translateY(-6px) rotateX(' + (-y * 4) + 'deg) rotateY(' + (x * 4) + 'deg)';
    });
    card.addEventListener('mouseleave', function() {
      card.style.transform = '';
    });
  });
}

/* ---------- Identity badge ---------- */
function updateBadge(val) {
  var badge = document.getElementById('identity-badge');
  var trimmed = val.trim();
  if (trimmed.length > 0) {
    var initials = trimmed.split(' ').slice(0, 2).map(function(w){ return w[0]; }).join('').toUpperCase();
    badge.textContent = initials;
    badge.classList.add('active');
  } else {
    badge.textContent = '?';
    badge.classList.remove('active');
  }
}

/* ---------- Roll validation ---------- */
function validateRoll(val) {
  var icon = document.getElementById('roll-valid-icon');
  var valid = val.trim().length >= 4;
  if (valid) icon.classList.add('show');
  else icon.classList.remove('show');
}

/* ---------- Section select ---------- */
function selectSection(sec) {
  _selectedSection = sec;
  document.getElementById('inp-section').value = sec;
  document.getElementById('btn-section-a').classList.toggle('selected', sec === 'A');
  document.getElementById('btn-section-b').classList.toggle('selected', sec === 'B');
}

/* ---------- Load stats ---------- */
async function loadStats() {
  try {
    var res  = await fetch(SHEETDB_URL, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) return;
    var rows = await res.json();
    if (!Array.isArray(rows)) return;
    /* Must match the format saved by markAttendance — "06 May 2026" */
    var _months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var todayStr = String(today.getDate()).padStart(2,'0') + ' ' + _months[today.getMonth()] + ' ' + today.getFullYear();
    var sessions = {};
    rows.forEach(function(r) { if (r.Session) sessions[r.Session] = true; });

    function animateNum(el, target) {
      el.classList.remove('loading');
      var start = 0;
      var dur = 800;
      var t0 = performance.now();
      function step(now) {
        var prog = Math.min((now - t0) / dur, 1);
        var ease = 1 - Math.pow(1 - prog, 3);
        el.textContent = Math.round(ease * target);
        if (prog < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    animateNum(document.getElementById('stat-total'), rows.length);
    animateNum(document.getElementById('stat-today'), rows.filter(function(r) { return r.Date === todayStr; }).length);
    animateNum(document.getElementById('stat-sessions'), Object.keys(sessions).length);
  } catch(e) {
    ['stat-total','stat-today','stat-sessions'].forEach(function(id){
      var el = document.getElementById(id);
      el.classList.remove('loading');
      el.textContent = '—';
    });
    console.warn('Stats load failed:', e);
  }
}

/* ---------- Mark attendance ---------- */
async function markAttendance() {
  /* ── Submission lock: blocks any concurrent/double-tap call ── */
  if (_isSubmitting) return;

  hideAlerts();

  /* ── Attendance time-window check ── */
  var _win = C.attendanceWindow;
  if (_win && _win.startTime && _win.endTime) {
    var _now  = new Date();
    var _hhmm = String(_now.getHours()).padStart(2,'0') + ':' + String(_now.getMinutes()).padStart(2,'0');
    if (_hhmm < _win.startTime || _hhmm >= _win.endTime) {
      /* Format times to 12-hr for friendlier display */
      function _fmt12(t) {
        var parts = t.split(':');
        var h = parseInt(parts[0], 10);
        var m = parts[1];
        var ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        return h + ':' + m + ' ' + ampm;
      }
      showAlert('error',
        'Attendance window is <strong>' + _fmt12(_win.startTime) + ' – ' + _fmt12(_win.endTime) + '</strong>. ' +
        'Time has completed to mark Attendance.'
      );
      return;
    }
  }

  var name    = document.getElementById('inp-name').value.trim();
  var roll    = document.getElementById('inp-roll').value.trim().toUpperCase();
  var section = _selectedSection;
  if (!name)    { showAlert('error', 'Please enter your full name.'); return; }
  if (!roll)    { showAlert('error', 'Please enter your roll number.'); return; }
  if (!section) { showAlert('error', 'Please select your section (A or B).'); return; }

  /* Lock BEFORE any await so no second call can slip through */
  _isSubmitting = true;
  var btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Saving…';

  try {
    /* Use cached sheet keys when available — saves one network round-trip */
    if (!_cachedSheetKeys) {
      var keysRes = await fetch(SHEETDB_URL + '/keys', { headers: { 'Accept': 'application/json' } });
      if (!keysRes.ok) throw new Error('Cannot reach SheetDB (' + keysRes.status + ')');
      _cachedSheetKeys = await keysRes.json();
    }
    var sheetKeys = _cachedSheetKeys;

    var allRes  = await fetch(SHEETDB_URL, { headers: { 'Accept': 'application/json' } });
    var allRows = allRes.ok ? await allRes.json() : [];
    if (Array.isArray(allRows) && allRows.length > 0) {
      var rollKey = sheetKeys.find(function(k){ return k.toLowerCase().replace(/\s+/g,'') === 'rollnumber'; }) || 'Roll Number';
      var sessKey = sheetKeys.find(function(k){ return k.toLowerCase() === 'session'; }) || 'Session';
      var dup = allRows.find(function(r) {
        return String(r[rollKey] || '').toUpperCase() === roll && String(r[sessKey] || '') === _currentSession;
      });
      if (dup) {
        showAlert('warning', 'Roll <strong>' + esc(roll) + '</strong> already marked for <em>' + esc(_currentSession) + '</em>.');
        return;
      }
    }

    function matchKey(pattern) {
      return sheetKeys.find(function(k) {
        return k.toLowerCase().replace(/\s+/g,'') === pattern.toLowerCase().replace(/\s+/g,'');
      }) || pattern;
    }
    var dayOfWeek = today.toLocaleDateString('en-IN', { weekday: 'long' });
    /* Format date as "06 May 2026" — day(2-digit) + space + month(short) + space + year */
    var _months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var dateStr = String(today.getDate()).padStart(2,'0') + ' ' + _months[today.getMonth()] + ' ' + today.getFullYear();
    var rowData   = {};
    rowData[matchKey('Name')]        = name;
    rowData[matchKey('RollNumber')]  = roll;
    rowData[matchKey('Section')]     = section;
    rowData[matchKey('Session')]     = _currentSession;
    rowData[matchKey('Day')]         = dayOfWeek;
    rowData[matchKey('Date')]        = dateStr;

    var postRes = await fetch(SHEETDB_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body:    JSON.stringify({ data: [rowData] })
    });
    var resultText = await postRes.text();
    var result;
    try { result = JSON.parse(resultText); } catch(e) { throw new Error('Bad response: ' + resultText); }
    if (!postRes.ok) throw new Error('SheetDB ' + postRes.status + ': ' + resultText);

    if (result.created && result.created > 0) {
      showAlert('success', '<strong>' + esc(name) + '</strong> (' + esc(roll) + ', Sec ' + esc(section) + ') marked present for <em>' + esc(_currentSession) + '</em>.');
      document.getElementById('inp-name').value = '';
      document.getElementById('inp-roll').value = '';
      updateBadge('');
      validateRoll('');
      _selectedSection = '';
      document.getElementById('inp-section').value = '';
      document.getElementById('btn-section-a').classList.remove('selected');
      document.getElementById('btn-section-b').classList.remove('selected');
      launchConfetti();
      loadStats();
    } else {
      showAlert('error', 'Keys used: ' + JSON.stringify(Object.keys(rowData)) + ' | Sheet keys: ' + JSON.stringify(sheetKeys) + ' | Response: ' + JSON.stringify(result));
    }
  } catch(e) {
    showAlert('error', 'Error: ' + e.message);
  } finally {
    /* Always release the lock and restore the button, even on error */
    _isSubmitting = false;
    resetBtn();
  }
}

/* ---------- Helpers ---------- */
function resetBtn() {
  var btn = document.getElementById('btn-submit');
  btn.disabled = false;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span>' + C.submitBtnText + '</span>';
}
function hideAlerts() { ['success','warning','error'].forEach(function(t) { document.getElementById('alert-'+t).classList.remove('show'); }); }
function showAlert(type, msg) {
  document.getElementById('alert-'+type+'-msg').innerHTML = msg;
  document.getElementById('alert-'+type).classList.add('show');
  if (type === 'success') setTimeout(function() { document.getElementById('alert-success').classList.remove('show'); }, 7000);
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- Debug helpers ---------- */
if (new URLSearchParams(window.location.search).get('debug') === '1') {
  document.getElementById('debug-panel').style.display = 'block';
}
async function runDebug() {
  var out = document.getElementById('debug-out');
  out.textContent = 'Fetching...';
  try {
    var r = await fetch(SHEETDB_URL);
    var j = await r.json();
    if (Array.isArray(j) && j.length > 0) {
      out.textContent = 'Keys from first row:\n' + Object.keys(j[0]).map(function(k){ return JSON.stringify(k) + ' (len:' + k.length + ')'; }).join('\n');
    } else {
      out.textContent = 'Response: ' + JSON.stringify(j);
    }
  } catch(e) { out.textContent = 'Error: ' + e.message; }
}
async function testPost() {
  var out = document.getElementById('debug-out');
  out.textContent = 'POSTing test row...';
  var testData = { 'Name':'TEST', 'Roll Number':'0000000', 'Section':'A', 'Session':'Debug', 'Day':'TestDay', 'Date':'01 January 2026' };
  out.textContent += '\nSending: ' + JSON.stringify(testData);
  try {
    var r = await fetch(SHEETDB_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: [testData] })
    });
    var j = await r.json();
    out.textContent += '\nResponse (' + r.status + '): ' + JSON.stringify(j);
  } catch(e) { out.textContent += '\nError: ' + e.message; }
}

/* ---------- Confetti — premium blue/violet/emerald palette ---------- */
function launchConfetti() {
  var canvas = document.getElementById('confetti-canvas');
  canvas.style.display = 'block';
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  var colors = ['#2563EB','#7C3AED','#10B981','#38BDF8','#F59E0B','#E2E8F0','#94A3B8','#0F172A'];
  var pieces = [];
  for (var i = 0; i < 140; i++) {
    pieces.push({
      x: Math.random()*canvas.width,
      y: -10 - Math.random()*140,
      r: 3 + Math.random()*7,
      c: colors[Math.floor(Math.random()*colors.length)],
      vx: (Math.random()-0.5)*5,
      vy: 2.8 + Math.random()*5,
      rot: Math.random()*360,
      vr: (Math.random()-0.5)*9,
      life: 1,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }
  var frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(function(p) {
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=0.009;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.r/2, 0, Math.PI*2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.r, -p.r/2, p.r*2, p.r);
      }
      ctx.restore();
    });
    if (++frame < 180) requestAnimationFrame(draw);
    else canvas.style.display = 'none';
  }
  draw();
}
</script>
